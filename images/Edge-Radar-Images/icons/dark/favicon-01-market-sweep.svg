<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Edge-Radar Market Sweep favicon concept</title>
  <desc id="desc">A square dark Edge-Radar icon showing a radar sweep finding market edges.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="22" x2="232" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="52" y1="44" x2="204" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="20" y="20" width="216" height="216" rx="42" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <circle cx="128" cy="128" r="72" fill="none" stroke="#1e293b" stroke-width="8"/>
  <circle cx="128" cy="128" r="46" fill="none" stroke="#1e293b" stroke-width="6"/>
  <path d="M128 128l57-55" stroke="#00d4aa" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M128 128h82" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <path d="M128 128v-82" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="11" fill="#e2e8f0"/>
  <circle cx="178" cy="82" r="14" fill="#00d4aa"/>
  <circle cx="78" cy="151" r="10" fill="#f59e0b"/>
  <circle cx="162" cy="181" r="10" fill="#ef4444"/>
  <path d="M80 197h96" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M80 197h54" stroke="#00d4aa" stroke-width="8" stroke-linecap="round"/>
</svg>
