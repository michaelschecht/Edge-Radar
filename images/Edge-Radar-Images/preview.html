<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge-Radar Logo Proposals</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #0a0e17;
        color: #e2e8f0;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
        line-height: 1.2;
      }

      h2 {
        font-size: 20px;
        line-height: 1.25;
      }

      p {
        margin-top: 8px;
        color: #94a3b8;
      }

      section {
        margin-top: 34px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-top: 16px;
      }

      .landscape {
        grid-template-columns: 1fr;
      }

      figure {
        margin: 0;
        padding: 16px;
        background: #0d1220;
        border: 1px solid #1e293b;
        border-radius: 8px;
      }

      .light-surface {
        background: #f8fafc;
        border-color: #cbd5e1;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid #00d4aa;
        outline-offset: 4px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      .icon img {
        max-width: 180px;
        margin: 0 auto;
      }

      figcaption {
        margin-top: 12px;
        color: #cbd5e1;
        font-size: 14px;
      }

      .light-surface figcaption {
        color: #334155;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Edge-Radar Logo Proposals</h1>
      <p>Three square favicon/button icons and three landscape GitHub/website logos, each in dark and light variants.</p>

      <section>
        <h2>Square Dark</h2>
        <div class="grid">
          <figure class="icon">
            <a href="./icons/dark/favicon-01-market-sweep.svg">
              <img src="./icons/dark/favicon-01-market-sweep.svg" alt="Market Sweep square icon" />
              <figcaption>01 Market Sweep</figcaption>
            </a>
          </figure>
          <figure class="icon">
            <a href="./icons/dark/favicon-02-fair-value-curve.svg">
              <img src="./icons/dark/favicon-02-fair-value-curve.svg" alt="Fair Value Curve square icon" />
              <figcaption>02 Fair Value Curve</figcaption>
            </a>
          </figure>
          <figure class="icon">
            <a href="./icons/dark/favicon-03-risk-gate.svg">
              <img src="./icons/dark/favicon-03-risk-gate.svg" alt="Risk Gate square icon" />
              <figcaption>03 Risk Gate</figcaption>
            </a>
          </figure>
        </div>
      </section>

      <section>
        <h2>Square Light</h2>
        <div class="grid">
          <figure class="icon light-surface">
            <a href="./icons/light/favicon-01-market-sweep-light.svg">
              <img src="./icons/light/favicon-01-market-sweep-light.svg" alt="Market Sweep light square icon" />
              <figcaption>01 Market Sweep Light</figcaption>
            </a>
          </figure>
          <figure class="icon light-surface">
            <a href="./icons/light/favicon-02-fair-value-curve-light.svg">
              <img src="./icons/light/favicon-02-fair-value-curve-light.svg" alt="Fair Value Curve light square icon" />
              <figcaption>02 Fair Value Curve Light</figcaption>
            </a>
          </figure>
          <figure class="icon light-surface">
            <a href="./icons/light/favicon-03-risk-gate-light.svg">
              <img src="./icons/light/favicon-03-risk-gate-light.svg" alt="Risk Gate light square icon" />
              <figcaption>03 Risk Gate Light</figcaption>
            </a>
          </figure>
        </div>
      </section>

      <section>
        <h2>Landscape Dark</h2>
        <div class="grid landscape">
          <figure>
            <a href="./logos/dark/landscape-01-market-sweep.svg">
              <img src="./logos/dark/landscape-01-market-sweep.svg" alt="Market Sweep landscape logo" />
              <figcaption>01 Market Sweep</figcaption>
            </a>
          </figure>
          <figure>
            <a href="./logos/dark/landscape-02-fair-value-curve.svg">
              <img src="./logos/dark/landscape-02-fair-value-curve.svg" alt="Fair Value Curve landscape logo" />
              <figcaption>02 Fair Value Curve</figcaption>
            </a>
          </figure>
          <figure>
            <a href="./logos/dark/landscape-03-risk-gate.svg">
              <img src="./logos/dark/landscape-03-risk-gate.svg" alt="Risk Gate landscape logo" />
              <figcaption>03 Risk Gate</figcaption>
            </a>
          </figure>
        </div>
      </section>

      <section>
        <h2>Landscape Light</h2>
        <div class="grid landscape">
          <figure class="light-surface">
            <a href="./logos/light/landscape-01-market-sweep-light.svg">
              <img src="./logos/light/landscape-01-market-sweep-light.svg" alt="Market Sweep light landscape logo" />
              <figcaption>01 Market Sweep Light</figcaption>
            </a>
          </figure>
          <figure class="light-surface">
            <a href="./logos/light/landscape-02-fair-value-curve-light.svg">
              <img src="./logos/light/landscape-02-fair-value-curve-light.svg" alt="Fair Value Curve light landscape logo" />
              <figcaption>02 Fair Value Curve Light</figcaption>
            </a>
          </figure>
          <figure class="light-surface">
            <a href="./logos/light/landscape-03-risk-gate-light.svg">
              <img src="./logos/light/landscape-03-risk-gate-light.svg" alt="Risk Gate light landscape logo" />
              <figcaption>03 Risk Gate Light</figcaption>
            </a>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
