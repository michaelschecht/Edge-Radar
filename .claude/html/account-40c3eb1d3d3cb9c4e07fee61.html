const fmtUSD = v => (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
const fmtPct = v => (v * 100).toFixed(1) + '%';
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'neutral';

const layoutBase = {
  paper_bgcolor: '#161b22', plot_bgcolor: '#161b22',
  font: { color: '#c9d1d9', family: 'Segoe UI, sans-serif', size: 12 },

  xaxis: { gridcolor: '#30363d', linecolor: '#30363d', zerolinecolor: '#30363d' },
  yaxis: { gridcolor: '#30363d', linecolor: '#30363d', zerolinecolor: '#30363d' },
};

const s = DATA.summary;
document.getElementById('subtitle').textContent =
  `Deposit ${fmtUSD(s.deposit)} on ${s.deposit_date}  •  ${s.total_bets} settled bets through ${s.last_settlement.slice(0,10)}  •  Live snapshot ${s.live_as_of}  •  Generated ${s.generated_at}`;

const totalReturn = s.current_balance - s.deposit;
const totalReturnPct = totalReturn / s.deposit;

document.getElementById('footnote').innerHTML =
  `<b>Total balance ${fmtUSD(s.current_balance)}</b> = cash ${fmtUSD(s.live_cash)} + open-position value ${fmtUSD(s.live_portfolio)} ` +
  `(${s.live_open_positions} positions on the book as of ${s.live_as_of}). ` +
  `<br><b>Modeled-from-settlements only:</b> deposit ${fmtUSD(s.deposit)} + settled P&amp;L ${fmtUSD(s.total_pnl)} = ${fmtUSD(s.settled_balance)}. ` +
  `The <b class="${cls(s.open_position_drift)}">${fmtUSD(s.open_position_drift)}</b> difference is unrealized value sitting in open positions ` +
  `(plus any settlements not yet pulled into the local ledger). ` +
  `<br>Sport &amp; bet-type derived from ticker prefix (pre-R5 cohort has null <code>category</code>).`;

const kpis = [
  {label: 'Total Balance',    value: fmtUSD(s.current_balance), sub: `${fmtUSD(totalReturn)} (${fmtPct(totalReturnPct)}) on ${fmtUSD(s.deposit)} deposit`, klass: cls(totalReturn)},
  {label: 'Cash + Positions', value: `${fmtUSD(s.live_cash)} + ${fmtUSD(s.live_portfolio)}`, sub: `${s.live_open_positions} open positions`},
  {label: 'Settled P&L',      value: fmtUSD(s.total_pnl), sub: `ROI ${fmtPct(s.total_roi)} on ${fmtUSD(s.total_cost)} risked`, klass: cls(s.total_pnl)},

];
document.getElementById('kpi-row').innerHTML = kpis.map(k => `

    <div class="stat-value ${k.klass||''}">${k.value}</div>
    <div class="stat-sub">${k.sub}</div>
  </div>
`).join('');

    return `<b>${d.date} (LIVE)</b><br>Total: ${fmtUSD(d.balance)}<br>` +

    (d.bets > 0 ? `<br>Record: ${d.wins}W-${d.losses}L` : '');
});

const liveY = liveIdx >= 0 ? [DATA.daily[liveIdx].balance] : [];
const markerSizes = DATA.daily.map(d => d.is_live ? 14 : 6);

);
const markerSymbols = DATA.daily.map(d => d.is_live ? 'star' : 'circle');

function barChart(divId, rows, title) {
  const labels = rows.map(r => r.label);
  const pnls = rows.map(r => r.pnl);
  const colors = pnls.map(p => p >= 0 ? '#3fb950' : '#f85149');
  const text = rows.map(r =>
    `<b>${r.label}</b><br>P&L: ${fmtUSD(r.pnl)}<br>` +
    `Bets: ${r.bets} (${r.wins}W)<br>Win Rate: ${fmtPct(r.win_rate)}<br>ROI: ${fmtPct(r.roi)}`
  );
  Plotly.newPlot(divId, [{
    type: 'bar', x: labels, y: pnls, marker: { color: colors },
    hovertext: text, hoverinfo: 'text',
    text: pnls.map(p => fmtUSD(p)), textposition: 'outside',
  }], {
    ...layoutBase,
    title: { text: title, font: { size: 13, color: '#8b949e' }, x: 0.02 },
    yaxis: { ...layoutBase.yaxis, title: 'Net P&L (USD)', tickprefix: '$' },
    xaxis: { ...layoutBase.xaxis, automargin: true },
  }, { displaylogo: false, responsive: true });
}

html += '</tbody></table>';
